<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5cff"><link rel="manifest" href="manifest.json"><title>RK Railway Mock Test</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.head{background:#0b5cff;color:white;padding:24px;border-radius:0 0 22px 22px}.card{background:white;margin:16px;padding:18px;border-radius:18px;box-shadow:0 3px 15px #0001}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#0b5cff;color:white;font-size:16px;font-weight:bold}.q{font-size:19px;line-height:1.5}.opt{padding:13px;margin:9px 0;border:2px solid #ddd;border-radius:11px}.sel{border-color:#0b5cff;background:#eaf0ff}</style></head><body><div class="head"><h1>🚆 RK Railway</h1><div>Railway Mock Test</div></div><div id="home" class="card"><h2>Mock Test</h2><p>10 questions • 10 minutes</p><button class="btn" onclick="start()">Start Mock Test</button></div><div id="quiz" class="card" style="display:none"><b id="num"></b><span style="float:right" id="time">10:00</span><div id="box"></div><button class="btn" onclick="next()" id="next">Next</button></div><div id="result" class="card" style="display:none"><h2>🎉 Result</h2><h1 id="score"></h1><button class="btn" onclick="start()">Try Again</button></div><script>const qs=[['भारत में पहली यात्री ट्रेन कब चली?', ['1853','1947','1905','1885'],0],['भारत की राजधानी?', ['मुंबई','नई दिल्ली','कोलकाता','चेन्नई'],1],['15 + 25 = ?', ['30','35','40','45'],2],['2, 4, 8, 16, ?', ['20','24','32','36'],2],['भारतीय रेलवे किस मंत्रालय के अधीन है?', ['गृह','रेल','वित्त','रक्षा'],1],['एक दर्जन में कितनी वस्तुएँ?', ['10','11','12','14'],2],['100 का 25%?', ['20','25','30','40'],1],['पानी का सूत्र?', ['CO2','O2','H2O','NaCl'],2],['सूर्य किस दिशा से उगता है?', ['उत्तर','दक्षिण','पूर्व','पश्चिम'],2],['भारत का राष्ट्रीय पशु?', ['शेर','बाघ','हाथी','मोर'],1]];let i=0,a=[],t=600,timer;function start(){i=0;a=[];t=600;home.style.display='none';result.style.display='none';quiz.style.display='block';clearInterval(timer);timer=setInterval(()=>{t--;time.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t<=0)finish()},1000);show()}function show(){num.textContent='Question '+(i+1)+'/'+qs.length;let q=qs[i];box.innerHTML='<div class=q>'+q[0]+'</div>'+q[1].map((x,n)=>'<div class="opt '+(a[i]===n?'sel':'')+'" onclick="a[i]='+n+';show()">'+String.fromCharCode(65+n)+'. '+x+'</div>').join('');next.textContent=i===qs.length-1?'Submit':'Next'}function next(){i<qs.length-1?(i++,show()):finish()}function finish(){clearInterval(timer);let s=a.reduce((z,x,n)=>z+(x===qs[n][2]?1:0),0);quiz.style.display='none';result.style.display='block';score.textContent=s+' / '+qs.length}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
