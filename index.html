<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railway Exam</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f5f7ff;padding-bottom:80px}header{padding:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px #0001}.logo{font-weight:800;font-size:20px;color:#0d47a1}.r{background:#0d47a1;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:bold}.banner{margin:14px;background:linear-gradient(135deg,#0d47a1,#1976d2);border-radius:18px;padding:16px;color:#fff}.progress{background:#ffffff40;height:8px;border-radius:10px;margin-top:10px;overflow:hidden}.bar{height:100%;background:#fff;width:38%}h2{margin:18px 14px 8px}.card{background:#fff;margin:10px 14px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0001}.ic{width:48px;height:48px;background:#e3f2fd;border-radius:50%;display:grid;place-items:center;font-size:22px}.big{width:calc(100% - 28px);margin:14px;background:#0d47a1;color:#fff;border:0;padding:16px;border-radius:14px;font-size:18px;font-weight:bold}button.q{width:100%;text-align:left;padding:12px;margin:6px 0;border:0;border-radius:10px;background:#eef2ff}.c{background:#c8e6c9!important}.w{background:#ffcdd2!important}</style></head><body><header><div class="logo">Railway Exam</div><div class="r">R</div></header><div id="home"><div class="banner"><h3 style="margin:0">RRB EXAM 2024</h3><p style="margin:4px 0;opacity:.9">Complete Preparation</p><div style="margin-top:14px">Your Progress • 38% Complete<div class="progress"><div class="bar"></div></div><small>12 of 32 chapters completed</small></div></div><h2>Chapters</h2><div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="ic">📘</div><div><b>History</b><br><small>British Era • 6 lessons</small></div></div><b style="color:#0d47a1">60%</b></div><div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="ic">📍</div><div><b>Zones</b><br><small>19 Zones • HQ • 5 lessons</small></div></div><b style="color:#0d47a1">25%</b></div><div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="ic">🏭</div><div><b>Factories</b><br><small>CLW, DLW, ICF • 4 lessons</small></div></div><b style="color:#0d47a1">10%</b></div><button class="big" onclick="document.getElementById('home').style.display='none';document.getElementById('test').style.display='block'">▶ Start Test • 100 Questions</button></div><div id="test" style="display:none;padding:14px"><button onclick="location.reload()" style="border:0;background:#fff;padding:8px 12px;border-radius:8px">← Back</button><h3>100Q Test</h3><div id="app"></div><div id="score" style="position:fixed;bottom:20px;right:10px;background:#0d47a1;color:#fff;padding:10px 16px;border-radius:20px">Score:0/100</div></div><script>const questions=[["Pehli rail kab chali?","16 Apr 1853","1854","1947","1850",0],["Railway HQ kahan?","Mumbai","Delhi","Kolkata","Chennai",1],["Sabse lamba platform?","Gorakhpur","Hubli","Kharagpur","Delhi",1],["IRCTC ka matlab?","Catering Corp","Track Corp","Road","Reserve",0],["Vande Bharat speed?","130","160","180","200",2],["Total Zones?","17","18","19","20",2],["Engine factory?","CLW","DLW","ICF","All",3],["RRB full form?","Recruitment Board","Reserve Board","Road Board","Run Board",0],["Fastest train?","Rajdhani","Shatabdi","Gatimaan","Vande",2],["Budget merge kab?","2016","2017","2018","2019",1]];for(let i=11;i<=100;i++)questions.push(["Q"+i+" Railway GK?","Option A","Option B","Option C","Option D",i%4]);let sc=0;const ap=document.getElementById("app");questions.forEach((item,idx)=>{let div=document.createElement("div");div.className="card";div.style.display="block";let correct=item[5];let html="<b>"+(idx+1)+". "+item[0]+"</b><br>";for(let j=1;j<=4;j++){html+=`<button class="q" onclick="checkAns(this,${correct},${j-1})">${String.fromCharCode(64+j)}. ${item[j]}</button>`}div.innerHTML=html;ap.appendChild(div)});function checkAns(btn,correct,chosen){let parent=btn.parentElement;if(parent.dataset.done)return;parent.dataset.done=1;if(chosen===correct){btn.className="q c";sc++;}else{btn.className="q w";parent.querySelectorAll("button")[correct].className="q c";}document.getElementById("score").innerText="Score:"+sc+"/100";}</script></body></html>
