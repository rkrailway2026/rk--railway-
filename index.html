<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRB Railway Exam</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f2f5ff;color:#102a5a;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.logo{font-weight:900;color:#0d47a1;font-size:22px;letter-spacing:.5px}
.avatar{width:38px;height:38px;background:linear-gradient(135deg,#0d47a1,#42a5f5);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800}
.banner{margin:14px;background:linear-gradient(135deg,#0d47a1 0%,#1976d2 100%);border-radius:20px;padding:20px;color:#fff}
.banner h2{margin:0 0 6px;font-size:22px} .banner p{margin:0;opacity:.9}
.ch-head{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-top:16px}
.card{background:#fff;margin:10px 16px;padding:14px 16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px #0000000e;cursor:pointer}
.card-left{display:flex;gap:12px;align-items:center} .ic{width:46px;height:46px;background:#e3f2fd;border-radius:12px;display:grid;place-items:center;font-size:22px}
.card b{font-size:16px} .card small{color:#6b7da0} .perc{color:#0d47a1;font-weight:800}
.btn{width:calc(100% - 32px);margin:16px;background:#0d47a1;color:#fff;border:0;padding:16px;border-radius:14px;font-size:17px;font-weight:700}
.page{display:none;padding:14px} .back{border:0;background:#fff;padding:8px 14px;border-radius:10px;box-shadow:0 2px 6px #0001}
.qcard{background:#fff;margin:12px 0;padding:14px;border-radius:14px;box-shadow:0 2px 8px #0001}
button.opt{width:100%;text-align:left;padding:12px;margin:7px 0;border:1px solid #e3e8f5;border-radius:10px;background:#f5f7ff;font-size:15px}
button.opt.correct{background:#c8e6c9!important;border-color:#4caf50} button.opt.wrong{background:#ffcdd2!important;border-color:#e53935}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 6px;border-top:1px solid #eef2ff}
nav div{text-align:center;font-size:11px;color:#8a9ab8} nav div.active{color:#0d47a1;font-weight:700}
#scoreBadge{position:fixed;bottom:78px;right:14px;background:#0d47a1;color:#fff;padding:10px 16px;border-radius:24px;font-weight:700;box-shadow:0 4px 12px #0d47a1aa}
</style>
</head>
